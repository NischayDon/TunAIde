<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TunAIde - Transcription Workspace</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind (CDN for Phase 1) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        // Map slate (neutrals) to a Blue/White palette
                        slate: {
                            50: '#F0F4F8',  // White/Lightest Blue
                            100: '#D9E2EC', // Light Blue
                            200: '#BCCCDC',
                            300: '#9FB3C8',
                            400: '#829AB1',
                            500: '#627D98', // Medium Blue
                            600: '#486581',
                            700: '#334E68',
                            800: '#243B53', // Dark Blue text
                            900: '#102A43', // Very Dark Blue
                        },
                        // Vibrant Primary Blue
                        blue: {
                            50: '#E6F0FF',
                            100: '#CCE0FF',
                            200: '#99C2FF',
                            300: '#66A3FF',
                            400: '#3385FF',
                            500: '#0066FF',
                            600: '#0052CC',
                            700: '#003D99',
                            800: '#002966',
                            900: '#001433',
                        },
                        // Map green/emerald/red to Crimson
                        emerald: {
                            50: '#FDE8ED',
                            100: '#FAD1DC',
                            200: '#F4A3BA',
                            300: '#EE7598',
                            400: '#E84776',
                            500: '#DC143C', // Crimson
                            600: '#B01030',
                            700: '#840C24',
                            800: '#580818',
                            900: '#2C040C',
                        },
                        green: {
                            50: '#FDE8ED',
                            100: '#FAD1DC',
                            200: '#F4A3BA',
                            300: '#EE7598',
                            400: '#E84776',
                            500: '#DC143C', // Crimson
                            600: '#B01030',
                            700: '#840C24',
                            800: '#580818',
                            900: '#2C040C',
                        },
                        red: {
                            50: '#FDE8ED',
                            100: '#FAD1DC',
                            200: '#F4A3BA',
                            300: '#EE7598',
                            400: '#E84776',
                            500: '#DC143C', // Crimson
                            600: '#B01030',
                            700: '#840C24',
                            800: '#580818',
                            900: '#2C040C',
                        }
                    },
                    typography: (theme) => ({
                        DEFAULT: {
                            css: {
                                color: theme('colors.slate.900'),
                            },
                        },
                    }),
                }
            },
            plugins: [
                // Minimal typography plugin simulation if CDN doesn't load it
            ]
        }
    </script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="/static/css/styles.css">

    <!-- Prose Mirror Styles (Simulation for nice text reading) -->
    <style>
        .prose p {
            margin-bottom: 1.25em;
            line-height: 1.75;
        }

        .prose {
            max-width: 65ch;
        }
    </style>
</head>

<body class="bg-slate-50 min-h-screen font-sans text-slate-900 selection:bg-blue-100 selection:text-blue-900">

    <!-- App Container -->
    <div id="app" class="flex min-h-screen">
        <!-- JS injects UI here -->
        <div class="m-auto text-center p-12">
            <div class="animate-spin w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full mx-auto mb-4">
            </div>
            <p class="text-slate-500 font-medium">Loading TunAIde...</p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/static/js/components.js?v=16"></script>
    <script src="/static/js/app.js?v=16"></script>
</body>

</html>
